name: deploy hunta-bible.pages.dev (+ independent gethunta smoke)
# 2026-09-27: the buyer-facing site lives on Cloudflare Pages (GitHub Pages was unreliable on
# phones). Every push to main rebuilds _cf/ (scripts/build_cf.py) and deploys it. Public repo:
# Actions minutes are free.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_cf.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # 2026-10-01: gethunta is owned by hunta/.github/workflows/pages-deploy.yml (landing/ carries
      # the whole buyer site). This repo deploying it too created a two-owners trap that silently
      # half-split the live site (Pages serves a union of old assets and falls missing ones back to
      # index.html with a 200). Bible-only from now on; the smoke below still watches gethunta
      # from the outside, non-fatally.
      - name: Deploy the bible (hunta-bible.pages.dev, internal, noindex)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _cf_bible --project-name hunta-bible --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
      - name: Smoke (bible fatal; gethunta informational)
        run: |
          set -e
          curl -fsSL https://hunta-bible.pages.dev/ | grep -q "AUTO-SECTIONS" || { echo "bible missing the vault sections"; exit 1; }
          curl -fsSL "https://hunta-bible.pages.dev/bible-assets/cards/$(curl -fsSL https://hunta-bible.pages.dev/ | grep -o 'bible-assets/cards/[a-z0-9-]*-x.png' | head -1 | cut -d/ -f3)" >/dev/null || { echo "bible card asset 404"; exit 1; }
          for u in / /demo /setup /downloads/hunta-demo-1.0.1.zip; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://gethunta.pages.dev$u")
            echo "gethunta $code $u (owner: hunta repo; informational only)"
          done
