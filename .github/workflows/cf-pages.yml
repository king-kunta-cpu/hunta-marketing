name: deploy gethunta.pages.dev + hunta-bible.pages.dev
# 2026-09-27: the buyer-facing site lives on Cloudflare Pages (GitHub Pages was unreliable on
# phones). Every push to main rebuilds _cf/ (scripts/build_cf.py) and deploys it. Public repo:
# Actions minutes are free.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_cf.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _cf --project-name gethunta --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
      - name: Deploy the bible (hunta-bible.pages.dev, internal, noindex)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _cf_bible --project-name hunta-bible --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
      - name: Smoke
        run: |
          set -e
          for u in / /demo /setup /downloads/hunta-demo-1.0.1.zip; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://gethunta.pages.dev$u")
            echo "$code $u"; [ "$code" = 200 ]
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' https://hunta-bible.pages.dev/); echo "$code bible"; [ "$code" = 200 ]
